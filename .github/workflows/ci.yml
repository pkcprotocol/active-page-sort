name: CI
on:
  push:
    paths: ['package.json', 'package-lock.json', 'tsconfig.json', 'tsconfig.build.json', 'vitest.config.ts', 'src/**', 'test/**', '.github/**']
  pull_request:
    paths: ['package.json', 'package-lock.json', 'tsconfig.json', 'tsconfig.build.json', 'vitest.config.ts', 'src/**', 'test/**', '.github/**']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      # The runner's Node 22 bundles npm 10, which rejects a lockfile written by npm 11 (nested optional
      # entries such as utf-8-validate get pruned). Pin the npm the lockfile is maintained with.
      - run: npm i -g npm@11.13.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:e2e
